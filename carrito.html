<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MaryamShop</title>
        <!--Importamos la librería de iconos de bootstrap-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="./css/index.css">
    </head>
    <body>
        <!--General container-->
        <div class="general-container">
             <!--Header para la parte de Mobile-->
             <header class="header-mobile">
                <h1 class="titulo-mobile">MaryamShop</h1>
                <!--Boton menu Mobile-->
                <button class="open-menu-mobile" id="open-menu-mobile">
                    <i class="bi bi-list"></i>
                </button>
            </header>
            <!--Left sidebar navigation-->
            <aside>
                <header>
                    <h1 class="logo">MaryamShop</h1>
                </header>
                <nav>
                    <ul>
                        <li>
                            <a class="boton-menu boton-volver" href="./index.html">
                                <i class="bi bi-arrow-return-left"></i> Seguir comprando 
                            </a>
                        </li>
                        <li>
                            <!--Dejamos el botón del carrito activo-->
                            <a class="boton-menu boton-carrito active" href="./carrito.html">
                                <i class="bi bi-cart-fill"></i> Carrito
                            </a>
                        </li>
                    </ul>
                </nav>
                <footer>
                    <p class="texto-footer">© 2024 Maryam Coder</p>
                </footer>
            </aside>
            <main>
                <h2 class="titulo-principal">Carrito</h2>
                <div class="contenedor-carrito">

                    <p id="carrito-vacio" class="carrito-vacio">Tu carrito está vacío. <i class="bi bi-emoji-frown"></i></p>
                    
                    <div id="carrito-productos" class="carrito-productos disabled">
                        <!-- Esta parte se rellenará con JavaScript -->
                    </div>
                <div id="carrito-acciones" class="carrito-acciones disabled">
                    <div class="carrito-acciones-izquierda">
                        <button id="carrito-acciones-vaciar" class="carrito-acciones-vaciar">Vaciar Carrito</button>
                    </div>
                    <div class="carrito-acciones-derecha">
                        <div class="carrito-acciones-total">
                            <p>Total</p>
                            <p id="total">$300</p>
                        </div>
                        <div id="arrito-acciones-comprar" class="carrito-acciones-comprar">
                            <button class="carrito-acciones-comprar" id="carrito-acciones-comprar">Comprar ahora</button>
                        </div>
                    </div>
                </div>

                <p id="carrito-comprado" class="carrito-comprado disabled">Muchas gracias por tu compra. <i class="bi bi-emoji-laughing"></i></p>

                </div>



            </main>
            

        </div>
        <script src="./js/menu.js"></script>
        <script src="./js/carrito.js" type="module"></script>
    </body>
</html>
